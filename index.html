<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>People of Ankleshwar — 3D Prototype</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#101820;font-family:system-ui,sans-serif}
  #hud{position:fixed;inset:12px 12px auto 12px;z-index:2;color:#fff;pointer-events:none;text-shadow:0 2px 5px #000}
  #brand{font-weight:800;font-size:18px;letter-spacing:.4px}
  #sub{font-size:12px;opacity:.85;margin-top:3px}
  #help{position:fixed;left:12px;bottom:12px;z-index:2;color:white;background:#07131dcc;padding:9px 11px;border-radius:10px;font-size:12px;max-width:250px}
  #mode,#cameraMode{position:fixed;right:12px;z-index:3;border:0;border-radius:12px;padding:11px 14px;background:#ffb000;color:#1b1b1b;font-weight:800}
  #mode{top:12px}
  #cameraMode{top:60px;background:#eaf2f8;color:#152532}
  #mobile{position:fixed;right:16px;bottom:18px;z-index:3;display:none;gap:9px}
  #mobile button{width:58px;height:58px;border:1px solid #ffffff88;border-radius:50%;background:#0b1d2ddd;color:white;font-size:20px}
  @media(max-width:800px){#mobile{display:flex}#help{max-width:185px;font-size:11px}}
  canvas{display:block}
</style>
</head>
<body>
<div id="hud"><div id="brand">PEOPLE OF ANKLESHWAR</div><div id="sub">3D CITY SIMULATOR · PROTOTYPE 0.2 · FULL-CITY BLOCKOUT</div></div>
<button id="mode">MODE: WALK</button>
<button id="cameraMode">CAMERA: THIRD PERSON</button>
<div id="help">चलें: WASD / Arrow keys · मोबाइल पर बटन इस्तेमाल करें<br>कैमरा बटन से First / Third Person बदलें।<br>यह शहर का शुरुआती blockout है; असली सड़कें/लोकेशन अभी मैप करनी हैं।</div>
<div id="mobile">
  <button data-k="ArrowLeft">◀</button><button data-k="ArrowUp">▲</button>
  <button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc7e8);
scene.fog = new THREE.Fog(0x9bc7e8, 100, 360);
const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, .1, 600);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9efff,0x526044,2.0));
const sun = new THREE.DirectionalLight(0xffedcf,3.0);
sun.position.set(-70,110,45); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); scene.add(sun);

const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600,600),mat(0x71835a));
ground.rotation.x=-Math.PI/2; ground.position.y=-.08; ground.receiveShadow=true; scene.add(ground);

// City blockout: broad roads, side streets and placeholder buildings.
const roadMat=mat(0x30363b), lineMat=mat(0xf3d77a), sidewalkMat=mat(0x9a9b91);
function road(x,z,w,d){
 const r=new THREE.Mesh(new THREE.BoxGeometry(w,.12,d),roadMat);r.position.set(x,0,z);r.receiveShadow=true;scene.add(r);
 if(w>d){
  for(let a=-w/2+4;a<w/2-2;a+=8){const l=new THREE.Mesh(new THREE.BoxGeometry(3,.025,.16),lineMat);l.position.set(x+a,.075,z);scene.add(l)}
 } else {
  for(let a=-d/2+4;a<d/2-2;a+=8){const l=new THREE.Mesh(new THREE.BoxGeometry(.16,.025,3),lineMat);l.position.set(x,.075,z+a);scene.add(l)}
 }
}
road(0,0,600,15); road(0,0,15,600); road(0,95,600,10); road(105,0,10,600); road(-110,0,10,600);
for(const [x,z,w,d] of [[0,10,600,2],[0,-10,600,2],[10,0,2,600],[-10,0,2,600]]){
 const s=new THREE.Mesh(new THREE.BoxGeometry(w,.18,d),sidewalkMat);s.position.set(x,.02,z);scene.add(s);
}
const colors=[0xb8a18a,0xd1c4a5,0x8fa5a8,0xc7b8aa,0xa9b5a0,0xd5d0c4];
function building(x,z,w,d,h,i){
 const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(colors[i%colors.length]));
 b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);
 // roof parapet
 const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.25,.35,d+.25),mat(0x77766f));
 roof.position.set(x,h+.17,z);roof.castShadow=true;scene.add(roof);
 // windows facing road-ish
 const winMat=new THREE.MeshStandardMaterial({color:0x34566a,metalness:.25,roughness:.3});
 for(let y=2.4;y<h-1;y+=3.1){
   for(let xx=-w/2+1.3;xx<w/2-0.5;xx+=2.6){
     const win=new THREE.Mesh(new THREE.BoxGeometry(.95,1.25,.07),winMat);
     win.position.set(x+xx,y,z+d/2+.04);scene.add(win);
   }
 }
}
let seed=19; const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
let idx=0;
for(let gx=-2;gx<=2;gx++) for(let gz=-2;gz<=2;gz++){
 if(gx===0||gz===0) continue;
 const cx=gx*105, cz=gz*105;
 for(let n=0;n<5;n++){
  const x=cx+(rand()-.5)*65, z=cz+(rand()-.5)*65;
  const w=12+rand()*13,d=12+rand()*13,h=9+rand()*32;
  building(x,z,w,d,h,idx++);
 }
}
// Landmark placeholders
function sign(text,x,z,color=0xffb000){
 const c=document.createElement('canvas');c.width=512;c.height=128;
 const ctx=c.getContext('2d');ctx.fillStyle='#102432';ctx.fillRect(0,0,512,128);
 ctx.fillStyle='#fff';ctx.font='bold 48px sans-serif';ctx.textAlign='center';ctx.fillText(text,256,80);
 const tex=new THREE.CanvasTexture(c);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(27,6.75),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));
 m.position.set(x,12,z);m.rotation.y=Math.PI/2;scene.add(m);
}
sign('ANKLESHWAR CITY',-22,18);
sign('GIDC INDUSTRIAL AREA',18,-28);
sign('RAILWAY STATION',-22,65);

// Trees
for(let i=0;i<65;i++){
 const x=(rand()-.5)*500,z=(rand()-.5)*500;
 if(Math.abs(x)<20||Math.abs(z)<20)continue;
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,4,7),mat(0x62452d));trunk.position.set(x,2,z);scene.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(2.7,8,7),mat(0x3e7041));crown.position.set(x,5,z);crown.castShadow=true;scene.add(crown);
}

// Player and simple drivable placeholder car
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.9,4,8),mat(0x2457a6));body.position.y=1.35;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.35,12,10),mat(0xd7a77e));head.position.y=2.25;player.add(head);
scene.add(player); player.position.set(0,0,25);
const car=new THREE.Group();
const carBody=new THREE.Mesh(new THREE.BoxGeometry(2.2,.8,4.2),mat(0xc0392b));carBody.position.y=.9;carBody.castShadow=true;car.add(carBody);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.8,.8,2),mat(0x263d4d));cabin.position.set(0,1.65,-.25);car.add(cabin);
for(const x of [-1,1])for(const z of [-1.35,1.35]){
 const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.25,12),mat(0x171717));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.45,z);car.add(wheel);
}
scene.add(car);car.position.set(0,0,0);car.visible=false;

let driving=false, firstPerson=false, yaw=0, speed=0;
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('#mobile button').forEach(b=>{
 const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k.toLowerCase()]=true});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k.toLowerCase()]=false));
});
document.getElementById('cameraMode').onclick=()=>{
 firstPerson=!firstPerson;
 document.getElementById('cameraMode').textContent='CAMERA: '+(firstPerson?'FIRST PERSON':'THIRD PERSON');
};
document.getElementById('mode').onclick=()=>{
 driving=!driving;document.getElementById('mode').textContent='MODE: '+(driving?'DRIVE':'WALK');
 if(driving){car.position.copy(player.position);car.rotation.y=yaw;car.visible=true;player.visible=false}
 else{player.position.copy(car.position);player.position.x+=2.5;player.visible=true;car.visible=false}
};
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);
 const forward=keys['w']||keys['arrowup'],back=keys['s']||keys['arrowdown'];
 const left=keys['a']||keys['arrowleft'],right=keys['d']||keys['arrowright'];
 const actor=driving?car:player;
 if(left)yaw+=dt*(driving?1.2:2.0);if(right)yaw-=dt*(driving?1.2:2.0);
 actor.rotation.y=yaw;
 const direction=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
 if(driving){
   if(forward)speed=Math.min(speed+dt*13,27);else if(back)speed=Math.max(speed-dt*16,-9);else speed*=.96;
   car.position.addScaledVector(direction,speed*dt);
 }else{
   const v=(forward?1:0)-(back?1:0);
   player.position.addScaledVector(direction,v*dt*13);
 }
 const target=actor.position.clone().add(new THREE.Vector3(0,driving?1.6:2.2,0));
 if(firstPerson){
   const eye=actor.position.clone().add(new THREE.Vector3(0,driving?2.0:2.0,0));
   camera.position.lerp(eye,.22);
   const look=eye.clone().add(new THREE.Vector3(Math.sin(yaw),-.04,Math.cos(yaw)).multiplyScalar(18));
   camera.lookAt(look);
 } else {
   const camOffset=new THREE.Vector3(-Math.sin(yaw)*11,7, -Math.cos(yaw)*11);
   camera.position.lerp(target.clone().add(camOffset),.09);
   camera.lookAt(target);
 }
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
